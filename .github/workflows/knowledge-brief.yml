name: Knowledge Brief

on:
  schedule:
    # 22:30 UTC (Minggu-Kamis) = 05:30 WIB (Senin-Jumat)
    - cron: '30 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-fund --no-audit
        working-directory: brief

      - name: Test audit gate
        run: npm test
        working-directory: brief

      - name: Generate edisi Knowledge Brief
        run: node generate.mjs
        working-directory: brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL || 'deepseek-v4-flash' }}
          BRIEF_MAX_TOKENS: ${{ vars.BRIEF_MAX_TOKENS || '24000' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1536x1024' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'high' }}

      - name: Validate generated page completeness
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Jakarta date +%F)"
          test -f "../briefs/${today}.html"
          TODAY="$today" node -e "const fs=require('fs'); const d=process.env.TODAY; const p='../briefs/'+d+'.html'; const html=fs.readFileSync(p,'utf8'); if (!/<\/body>\s*<\/html>\s*$/i.test(html)) throw new Error('article incomplete: missing closing body/html'); if (/<\s*$/.test(html) || /<[^>]{0,80}$/.test(html)) throw new Error('article incomplete: ends inside tag'); if ((html.match(/<section\b/gi)||[]).length !== (html.match(/<\/section>/gi)||[]).length) throw new Error('article incomplete: unbalanced section tags'); if ((html.match(/<div\b/gi)||[]).length !== (html.match(/<\/div>/gi)||[]).length) throw new Error('article incomplete: unbalanced div tags');"
        working-directory: brief

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "knowledge brief $(date -u +%F)"
            git push
          fi
